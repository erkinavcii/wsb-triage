name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The tool is Windows-only (Windows Sandbox, Authenticode, PowerShell), so the tests run on Windows.
    # GitHub's Windows images ship with 7-Zip, so the archive tests run too.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
